
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hackathon Participant Sign-Up</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f3f5f9;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 550px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #176f78;
            box-shadow: 0 0 4px rgba(23, 111, 120, 0.3);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn {
            background-color: #176f78;
            color: white;
        }

        .submit-btn:hover {
            background-color: #10575e;
        }

        .reset-btn {
            background-color: #e0e0e0;
            color: #333;
        }

        .reset-btn:hover {
            background-color: #cccccc;
        }

        .required-note {
            color: #777;
            font-size: 13px;
            margin-top: 15px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
        }
    </style>

</head>

<body>

    <main class="container">

        <h1>Hackathon Registration</h1>

        <p class="description">
            Join our exciting Hackathon event!
            Complete the registration form below
            to become a participant.
        </p>

        <form action="#" method="post">

            <!-- Participant Name -->
            <div class="form-group">

                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>

            <!-- Participant Email -->
            <div class="form-group">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

            </div>

            <!-- Participant Password -->
            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>

            <!-- Participant Age -->
            <div class="form-group">

                <label for="age">Age</label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter your age"
                    min="16"
                    max="100"
                    required
                >

            </div>

            <!-- Submit and Reset Buttons -->
            <div class="button-group">

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Submit
                </button>

                <button
                    type="reset"
                    class="reset-btn"
                >
                    Reset
                </button>

            </div>

            <p class="required-note">
                * All fields are required.
            </p>

        </form>

    </main>

</body>

</html>
